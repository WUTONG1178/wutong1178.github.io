<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROI Database</title>
  <meta name="description" content="ROI Database — PLM 投资回报评估工具集">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --text: #1a1a1a;
      --text-secondary: #555;
      --text-tertiary: #999;
      --border: #e0e0e0;
      --accent: #009999;
      --accent-hover: #006666;
      --shadow-hover: 0 12px 40px rgba(0,0,0,0.12);
      --radius: 8px;
      --max-width: 1200px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #0d0d0d;
      --bg-secondary: #161616;
      --text: #f0f0f0;
      --text-secondary: #aaa;
      --text-tertiary: #666;
      --border: #2a2a2a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Siemens Sans", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* ============ NAV（西门子式：白底细线顶栏） ============ */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }

    .nav-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .nav-logo span { color: var(--accent); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
      position: relative;
      transition: color var(--transition);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width var(--transition);
    }

    .nav-link:hover { color: var(--accent); }
    .nav-link:hover::after { width: 100%; }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--text);
      transition: all var(--transition);
    }

    .theme-toggle:hover { border-color: var(--accent); transform: rotate(15deg); }

    /* ============ HERO（西门子式：左图右文分栏） ============ */
    .hero {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 140px 32px 90px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
      min-height: 82vh;
    }

    .hero-media {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 4 / 3;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      animation: mediaIn 1s ease 0.2s both;
    }

    .hero-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1);
      animation: slowZoom 16s ease-in-out infinite alternate;
    }

    @keyframes slowZoom {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.06) translate(-1%, -1%); }
    }

    @keyframes mediaIn {
      from { opacity: 0; transform: translateX(-40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* 西门子式青色角标线 */
    .hero-media::before {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 4px;
      background: var(--accent);
      z-index: 2;
      animation: barGrow 1.2s ease 0.8s both;
    }

    @keyframes barGrow {
      to { width: 100%; }
    }

    .hero-content { animation: textIn 1s ease 0.35s both; }

    @keyframes textIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .hero-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(40px, 5.5vw, 64px);
      font-weight: 700;
      letter-spacing: -1.5px;
      line-height: 1.08;
      margin-bottom: 22px;
    }

    .hero h1 span { color: var(--accent); }

    .hero-subtitle {
      font-size: clamp(16px, 2vw, 19px);
      color: var(--text-secondary);
      margin-bottom: 40px;
      max-width: 460px;
    }

    /* 西门子式文字链接箭头 */
    .hero-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
      transition: all var(--transition);
    }

    .hero-link .arrow {
      display: inline-block;
      transition: transform var(--transition);
    }

    .hero-link:hover {
      color: var(--accent-hover);
      border-bottom-color: var(--accent-hover);
    }

    .hero-link:hover .arrow { transform: translateX(6px); }

    /* ============ 分隔条（西门子式青色细带） ============ */
    .divider {
      height: 1px;
      background: var(--border);
      max-width: var(--max-width);
      margin: 0 auto;
    }

    /* ============ PROJECT ============ */
    section {
      padding: 90px 32px 100px;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .section-label {
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .section-title {
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 48px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .project-card {
      background: var(--bg-secondary);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all var(--transition);
      cursor: pointer;
      border: 1px solid var(--border);
      position: relative;
    }

    .project-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 4px;
      background: var(--accent);
      z-index: 2;
      transition: width 0.4s ease;
    }

    .project-card:hover::before { width: 100%; }

    .project-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .project-thumb {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #0a1f2c 0%, #004c4c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      position: relative;
      overflow: hidden;
    }

    .project-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,153,153,0.2), rgba(0,0,0,0.25));
      transition: opacity var(--transition);
    }

    .project-card:hover .project-thumb::after { opacity: 0.6; }

    .project-body { padding: 26px; }

    .project-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .project-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .project-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .project-tags span {
      font-size: 12px;
      color: var(--text-tertiary);
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 100px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ============ FOOTER ============ */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 32px;
      text-align: center;
      font-size: 13px;
      color: var(--text-tertiary);
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 40px;
        padding: 110px 24px 70px;
        min-height: auto;
      }
      .hero-media { aspect-ratio: 16 / 10; }
      .hero-subtitle { max-width: 100%; }
    }

    @media (max-width: 768px) {
      .nav-inner { padding: 0 20px; }
      .nav-right { gap: 18px; }
      .nav-link { display: none; }
      .projects-grid { grid-template-columns: 1fr; }
      section { padding: 60px 20px 70px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <a href="#hero" class="nav-logo"><span>ROI</span> Database</a>
      <div class="nav-right">
        <a href="#project" class="nav-link">My Project</a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">🌙</button>
      </div>
    </div>
  </nav>

  <!-- HERO：左图右文 -->
  <div class="hero" id="hero">
    <div class="hero-media">
      <img src="assets/cover.png" alt="Siemens Xcelerator — 数字化转型">
    </div>
    <div class="hero-content">
      <div class="hero-badge">PLM Investment Analytics</div>
      <h1><span>ROI</span> Database</h1>
      <p class="hero-subtitle">把工业软件的投资回报算清楚，让每一笔数字化转型都有据可依。</p>
      <a href="#project" class="hero-link">查看项目 <span class="arrow">→</span></a>
    </div>
  </div>

  <div class="divider"></div>

  <!-- MY PROJECT -->
  <section id="project">
    <p class="section-label reveal">My Project</p>
    <h2 class="section-title reveal">项目</h2>
    <div class="projects-grid">
      <div class="project-card reveal" onclick="window.open('PLM_ROI_计算器.html','_blank')">
        <div class="project-thumb">📊</div>
        <div class="project-body">
          <h3 class="project-title">CRRC DLS · PLM ROI 计算器</h3>
          <p class="project-desc">为中车大连所量身定制的 PLM 建设投资回报分析工具，覆盖工时节省、BOM 错误成本、合规风险、TCO 与五年现金流。</p>
          <div class="project-tags"><span>PLM</span><span>ROI</span><span>数字化转型</span></div>
        </div>
      </div>
    </div>
  </section>

  <footer>ROI Database · 工业软件投资回报评估</footer>

  <script>
    // Theme toggle
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', next);
    }

    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.querySelector('.theme-toggle').textContent = '☀️';
      }
    })();

    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // Smooth scroll
    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener('click', (e) => {
        const target = document.querySelector(a.getAttribute('href'));
        if (target) {
          e.preventDefault();
          window.scrollTo({ top: target.offsetTop - 60, behavior: 'smooth' });
        }
      });
    });
  </script>
</body>
</html>
