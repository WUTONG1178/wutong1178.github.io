<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROI Database</title>
  <meta name="description" content="ROI Database — PLM 投资回报评估工具集">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #000028;
      --bg-secondary: #050540;
      --text: #f0f0f0;
      --text-secondary: #a0aec0;
      --text-tertiary: #64748b;
      --border: #1b1b55;
      --accent: #009999;
      --accent-hover: #00b5b5;
      --shadow-hover: 0 12px 40px rgba(0,153,153,0.15);
      --radius: 16px;
      --max-width: 1200px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --text: #1a1a1a;
      --text-secondary: #555;
      --text-tertiary: #999;
      --border: #e0e0e0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Siemens Sans", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* ============ NAV ============ */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      background: rgba(0,0,40,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }

    .nav-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .nav-logo span { color: var(--accent); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
      position: relative;
      transition: color var(--transition);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width var(--transition);
    }

    .nav-link:hover { color: var(--accent); }
    .nav-link:hover::after { width: 100%; }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--text);
      transition: all var(--transition);
    }

    .theme-toggle:hover { border-color: var(--accent); transform: rotate(15deg); }

    /* ============ HERO（深色左图右文） ============ */
    .hero {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 140px 32px 100px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 64px;
      align-items: center;
      min-height: 90vh;
    }

    .hero-media {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: mediaIn 1s ease 0.2s both;
      isolation: isolate;
    }

    /* 呼吸青色光晕（垫在图片后面，与深藏青背景融合） */
    .hero-media::before {
      content: '';
      position: absolute;
      width: 88%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(0,153,153,0.28) 0%,
        rgba(0,153,153,0.10) 45%,
        transparent 70%);
      filter: blur(10px);
      z-index: -1;
      animation: glowPulse 5s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.07); }
    }

    /* 缓慢旋转的虚线光环 */
    .hero-ring {
      position: absolute;
      width: 92%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px dashed rgba(0,181,181,0.35);
      z-index: 0;
      pointer-events: none;
      animation: ringSpin 60s linear infinite;
    }

    .hero-ring::after {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px 2px rgba(0,181,181,0.8);
    }

    @keyframes ringSpin {
      to { transform: rotate(360deg); }
    }

    /* 第二圈反向旋转的暗光环 */
    .hero-ring-2 {
      position: absolute;
      width: 102%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(0,153,153,0.12);
      z-index: 0;
      pointer-events: none;
      animation: ringSpinRev 90s linear infinite;
    }

    .hero-ring-2::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 18%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(0,181,181,0.7);
      box-shadow: 0 0 8px 1px rgba(0,181,181,0.5);
    }

    @keyframes ringSpinRev {
      to { transform: rotate(-360deg); }
    }

    /* 环绕漂浮的小光点 */
    .hero-dots {
      position: absolute;
      inset: -6%;
      z-index: 0;
      pointer-events: none;
    }

    .hero-dots span {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(0,181,181,0.65);
      box-shadow: 0 0 8px rgba(0,181,181,0.6);
      animation: dotFloat 7s ease-in-out infinite;
    }

    .hero-dots span:nth-child(1) { top: 12%; left: 8%; animation-delay: 0s; }
    .hero-dots span:nth-child(2) { top: 22%; right: 10%; width: 4px; height: 4px; animation-delay: 1.5s; }
    .hero-dots span:nth-child(3) { bottom: 18%; left: 14%; width: 3px; height: 3px; animation-delay: 3s; }
    .hero-dots span:nth-child(4) { bottom: 10%; right: 18%; animation-delay: 4.2s; }
    .hero-dots span:nth-child(5) { top: 45%; left: 2%; width: 4px; height: 4px; animation-delay: 2.2s; }
    .hero-dots span:nth-child(6) { top: 55%; right: 3%; width: 3px; height: 3px; animation-delay: 5s; }

    @keyframes dotFloat {
      0%, 100% { transform: translateY(0); opacity: 0.35; }
      50% { transform: translateY(-16px); opacity: 1; }
    }

    .hero-media img {
      width: 100%;
      max-width: 520px;
      height: auto;
      object-fit: contain;
      display: block;
      transform: scale(1);
      animation: slowZoom 16s ease-in-out infinite alternate;
      position: relative;
      z-index: 1;
    }

    @keyframes slowZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.04); }
    }

    @keyframes mediaIn {
      from { opacity: 0; transform: translateX(-40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .hero-content { animation: textIn 1s ease 0.35s both; }

    @keyframes textIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .hero-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1.05;
      margin-bottom: 22px;
    }

    .hero h1 span { color: var(--accent); }

    .hero-subtitle {
      font-size: clamp(17px, 2.2vw, 21px);
      color: var(--text-secondary);
      margin-bottom: 44px;
      max-width: 480px;
    }

    .hero-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
      transition: all var(--transition);
    }

    .hero-link .arrow {
      display: inline-block;
      transition: transform var(--transition);
    }

    .hero-link:hover {
      color: var(--accent-hover);
      border-bottom-color: var(--accent-hover);
    }

    .hero-link:hover .arrow { transform: translateX(6px); }

    /* ============ PROJECT ============ */
    section {
      padding: 90px 32px 100px;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .section-label {
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .section-title {
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 48px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .project-card {
      background: var(--bg-secondary);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all var(--transition);
      cursor: pointer;
      border: 1px solid var(--border);
      position: relative;
    }

    .project-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 4px;
      background: var(--accent);
      z-index: 2;
      transition: width 0.4s ease;
    }

    .project-card:hover::before { width: 100%; }

    .project-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .project-thumb {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #0a1f2c 0%, #004c4c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      position: relative;
      overflow: hidden;
    }

    .project-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,153,153,0.2), rgba(0,0,0,0.25));
      transition: opacity var(--transition);
    }

    .project-card:hover .project-thumb::after { opacity: 0.6; }

    .project-body { padding: 26px; }

    .project-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .project-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .project-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .project-tags span {
      font-size: 12px;
      color: var(--text-tertiary);
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 100px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ============ FOOTER ============ */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 32px;
      text-align: center;
      font-size: 13px;
      color: var(--text-tertiary);
    }

    /* ============ PASSWORD MODAL ============ */
    .pw-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 40, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .pw-overlay.active { opacity: 1; pointer-events: auto; }

    .pw-modal {
      width: min(360px, calc(100vw - 48px));
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 14px;
      padding: 32px 28px 26px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      transform: translateY(16px) scale(0.97);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pw-overlay.active .pw-modal { transform: translateY(0) scale(1); }

    .pw-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: rgba(0, 153, 153, 0.12);
      border: 1px solid rgba(0, 153, 153, 0.35);
    }

    .pw-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .pw-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .pw-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      font-size: 15px;
      letter-spacing: 2px;
      text-align: center;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .pw-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 153, 153, 0.18);
    }
    .pw-input.error {
      border-color: #e5484d;
      box-shadow: 0 0 0 3px rgba(229, 72, 77, 0.18);
      animation: pwShake 0.4s ease;
    }
    @keyframes pwShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .pw-error-msg {
      font-size: 12px;
      color: #e5484d;
      height: 18px;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .pw-error-msg.show { opacity: 1; }

    .pw-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .pw-btn {
      flex: 1;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .pw-btn:hover { color: var(--text); border-color: var(--text-tertiary); }
    .pw-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .pw-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 40px;
        padding: 110px 24px 70px;
        min-height: auto;
        text-align: center;
      }
      .hero-media img { max-width: 420px; }
      .hero-subtitle { max-width: 100%; margin-left: auto; margin-right: auto; }
      .hero-link { justify-content: center; }
    }

    @media (max-width: 768px) {
      .nav-inner { padding: 0 20px; }
      .nav-right { gap: 18px; }
      .nav-link { display: none; }
      .projects-grid { grid-template-columns: 1fr; }
      section { padding: 60px 20px 70px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <a href="#hero" class="nav-logo"><span>ROI</span> Database</a>
      <div class="nav-right">
        <a href="#project" class="nav-link">My Project</a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">☀️</button>
      </div>
    </div>
  </nav>

  <!-- HERO：左图右文 -->
  <div class="hero" id="hero">
    <div class="hero-media">
      <div class="hero-ring"></div>
      <div class="hero-ring-2"></div>
      <div class="hero-dots">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <img src="assets/cover.png" alt="Siemens Xcelerator">
    </div>
    <div class="hero-content">
      <div class="hero-badge">PLM Investment Analytics</div>
      <h1><span>ROI</span> Database</h1>
      <p class="hero-subtitle">把工业软件的投资回报算清楚，让数字化转型有据可依。</p>
      <a href="#project" class="hero-link">查看项目 <span class="arrow">→</span></a>
    </div>
  </div>

  <!-- MY PROJECT -->
  <section id="project">
    <p class="section-label reveal">My Project</p>
    <h2 class="section-title reveal">项目</h2>
    <div class="projects-grid">
      <div class="project-card reveal" onclick="openProject()">
        <div class="project-thumb">📊</div>
        <div class="project-body">
          <h3 class="project-title">CRRC DLS · PLM ROI 计算器</h3>
          <p class="project-desc">为中车大连所量身定制的 PLM 建设投资回报分析工具，覆盖工时节省、BOM 错误成本、合规风险、TCO 与五年现金流。</p>
          <div class="project-tags"><span>PLM</span><span>ROI</span><span>数字化转型</span></div>
        </div>
      </div>
    </div>
  </section>

  <footer>ROI Database · 工业软件投资回报评估</footer>

  <!-- PASSWORD MODAL -->
  <div class="pw-overlay" id="pwOverlay" onclick="handleOverlayClick(event)">
    <div class="pw-modal">
      <div class="pw-icon">🔐</div>
      <div class="pw-title">访问验证</div>
      <div class="pw-desc">该内容为受保护项目，请输入访问密码</div>
      <input type="password" class="pw-input" id="pwInput" placeholder="请输入密码" autocomplete="off">
      <div class="pw-error-msg" id="pwErrorMsg">密码错误，请重新输入</div>
      <div class="pw-actions">
        <button class="pw-btn" onclick="closePwModal()">取消</button>
        <button class="pw-btn primary" onclick="submitPassword()">确认</button>
      </div>
    </div>
  </div>

  <script>
    // Password protection
    const PROJECT_PASSWORD = '123456';

    function openProject() {
      document.getElementById('pwOverlay').classList.add('active');
      document.getElementById('pwErrorMsg').classList.remove('show');
      const input = document.getElementById('pwInput');
      input.value = '';
      input.classList.remove('error');
      setTimeout(() => input.focus(), 200);
    }

    function closePwModal() {
      document.getElementById('pwOverlay').classList.remove('active');
    }

    function handleOverlayClick(e) {
      if (e.target === e.currentTarget) closePwModal();
    }

    function submitPassword() {
      const input = document.getElementById('pwInput');
      const errMsg = document.getElementById('pwErrorMsg');
      if (input.value === PROJECT_PASSWORD) {
        closePwModal();
        window.open('PLM_ROI_计算器.html', '_blank');
      } else {
        input.classList.remove('error');
        void input.offsetWidth; // restart shake animation
        input.classList.add('error');
        errMsg.classList.add('show');
        input.select();
      }
    }

    document.getElementById('pwInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitPassword();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePwModal();
    });
  </script>

  <script>
    // Theme toggle
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', next);
    }

    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.querySelector('.theme-toggle').textContent = '🌙';
      }
    })();

    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // Smooth scroll
    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener('click', (e) => {
        const target = document.querySelector(a.getAttribute('href'));
        if (target) {
          e.preventDefault();
          window.scrollTo({ top: target.offsetTop - 64, behavior: 'smooth' });
        }
      });
    });
  </script>
</body>
</html>
