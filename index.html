<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROI Database</title>
  <meta name="description" content="ROI Database — PLM 投资回报评估工具集">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --text: #1a1a1a;
      --text-secondary: #555;
      --text-tertiary: #999;
      --border: #e0e0e0;
      --accent: #009999;
      --accent-hover: #006666;
      --shadow: 0 2px 20px rgba(0,0,0,0.06);
      --shadow-hover: 0 12px 40px rgba(0,0,0,0.12);
      --radius: 14px;
      --max-width: 960px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #0d0d0d;
      --bg-secondary: #161616;
      --text: #f0f0f0;
      --text-secondary: #aaa;
      --text-tertiary: #666;
      --border: #2a2a2a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* ============ NAV ============ */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      background: rgba(13,13,13,0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      transition: background var(--transition);
    }

    .nav-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .nav-logo span { color: var(--accent); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-link {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      font-weight: 500;
      transition: color var(--transition);
    }

    .nav-link:hover { color: #fff; }

    .theme-toggle {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      transition: all var(--transition);
    }

    .theme-toggle:hover { background: rgba(255,255,255,0.2); transform: rotate(15deg); }

    /* ============ HERO ============ */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px 60px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: url('assets/cover.png') center/cover no-repeat;
      transform: scale(1);
      animation: heroZoom 18s ease-in-out infinite alternate;
      z-index: -2;
    }

    @keyframes heroZoom {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.1) translate(-1%, -1%); }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 40%, rgba(0,153,153,0.12) 0%, transparent 55%),
        linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.75) 100%);
      z-index: -1;
      animation: overlayShift 10s ease-in-out infinite alternate;
    }

    @keyframes overlayShift {
      0% { opacity: 1; }
      100% { opacity: 0.92; }
    }

    .hero-particles {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .hero-particles span {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      animation: floatUp 8s linear infinite;
    }

    .hero-particles span:nth-child(1) { left: 10%; bottom: -10px; animation-delay: 0s; animation-duration: 9s; }
    .hero-particles span:nth-child(2) { left: 25%; bottom: -10px; animation-delay: 2s; animation-duration: 12s; width: 4px; height: 4px; }
    .hero-particles span:nth-child(3) { left: 45%; bottom: -10px; animation-delay: 4s; animation-duration: 10s; }
    .hero-particles span:nth-child(4) { left: 65%; bottom: -10px; animation-delay: 1s; animation-duration: 14s; width: 3px; height: 3px; }
    .hero-particles span:nth-child(5) { left: 80%; bottom: -10px; animation-delay: 3s; animation-duration: 11s; }
    .hero-particles span:nth-child(6) { left: 92%; bottom: -10px; animation-delay: 5s; animation-duration: 13s; width: 5px; height: 5px; }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(-110vh) scale(0.5); opacity: 0; }
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 720px;
      color: #fff;
    }

    .hero-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(0,153,153,0.15);
      border: 1px solid rgba(0,153,153,0.3);
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 24px;
      animation: fadeInDown 1s ease both;
    }

    .hero h1 {
      font-size: clamp(48px, 10vw, 84px);
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1.05;
      margin-bottom: 20px;
      animation: fadeInUp 1s ease 0.15s both;
      text-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }

    .hero h1 span { color: var(--accent); }

    .hero-subtitle {
      font-size: clamp(16px, 3vw, 22px);
      color: rgba(255,255,255,0.82);
      margin-bottom: 36px;
      font-weight: 400;
      animation: fadeInUp 1s ease 0.3s both;
    }

    .hero-cta {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeInUp 1s ease 0.45s both;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      border: 1.5px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 30px rgba(0,153,153,0.35);
    }

    .btn-primary:hover {
      background: #00b5b5;
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,153,153,0.5);
    }

    .btn-outline {
      border-color: rgba(255,255,255,0.35);
      color: #fff;
      background: rgba(255,255,255,0.08);
    }

    .btn-outline:hover {
      border-color: #fff;
      background: rgba(255,255,255,0.16);
      transform: translateY(-3px);
    }

    .scroll-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 40px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 13px;
      display: flex;
      justify-content: center;
      animation: fadeInUp 1s ease 0.6s both;
    }

    .scroll-hint::before {
      content: '';
      width: 4px;
      height: 8px;
      background: #fff;
      border-radius: 2px;
      margin-top: 7px;
      animation: scrollDot 1.6s ease-in-out infinite;
    }

    @keyframes scrollDot {
      0%, 100% { transform: translateY(0); opacity: 1; }
      50% { transform: translateY(8px); opacity: 0.4; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ PROJECT ============ */
    section {
      padding: 100px 24px;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .section-label {
      font-size: 13px;
      color: var(--text-tertiary);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .section-title {
      font-size: clamp(28px, 5vw, 36px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 48px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .project-card {
      background: var(--bg-secondary);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all var(--transition);
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .project-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-6px);
      border-color: var(--accent);
    }

    .project-thumb {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #0a1f2c 0%, #004c4c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      position: relative;
      overflow: hidden;
    }

    .project-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,153,153,0.2), rgba(0,0,0,0.25));
      transition: opacity var(--transition);
    }

    .project-card:hover .project-thumb::after { opacity: 0.6; }

    .project-body { padding: 26px; }

    .project-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .project-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .project-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .project-tags span {
      font-size: 12px;
      color: var(--text-tertiary);
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 100px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 768px) {
      .nav-right { gap: 16px; }
      .nav-link { display: none; }
      .projects-grid { grid-template-columns: 1fr; }
      section { padding: 70px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <a href="#hero" class="nav-logo"><span>ROI</span> Database</a>
      <div class="nav-right">
        <a href="#project" class="nav-link">My Project</a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">🌙</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <div class="hero" id="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-particles">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="hero-content">
      <div class="hero-badge">PLM Investment Analytics</div>
      <h1><span>ROI</span> Database</h1>
      <p class="hero-subtitle">把工业软件的投资回报算清楚，让每一笔数字化转型都有据可依。</p>
      <div class="hero-cta">
        <a href="PLM_ROI_计算器.html" class="btn btn-primary">打开 ROI 计算器 →</a>
        <a href="#project" class="btn btn-outline">查看项目 →</a>
      </div>
    </div>
    <div class="scroll-hint"></div>
  </div>

  <!-- MY PROJECT -->
  <section id="project">
    <p class="section-label reveal">My Project</p>
    <h2 class="section-title reveal">项目</h2>
    <div class="projects-grid">
      <div class="project-card reveal" onclick="window.open('PLM_ROI_计算器.html','_blank')">
        <div class="project-thumb">📊</div>
        <div class="project-body">
          <h3 class="project-title">CRRC DLS · PLM ROI 计算器</h3>
          <p class="project-desc">为中车大连所量身定制的 PLM 建设投资回报分析工具，覆盖工时节省、BOM 错误成本、合规风险、TCO 与五年现金流。</p>
          <div class="project-tags"><span>PLM</span><span>ROI</span><span>数字化转型</span></div>
        </div>
      </div>
    </div>
  </section>

  <script>
    // Theme toggle
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', next);
    }

    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.querySelector('.theme-toggle').textContent = '☀️';
      }
    })();

    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // Smooth scroll
    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener('click', (e) => {
        const target = document.querySelector(a.getAttribute('href'));
        if (target) {
          e.preventDefault();
          window.scrollTo({ top: target.offsetTop - 64, behavior: 'smooth' });
        }
      });
    });
  </script>
</body>
</html>
